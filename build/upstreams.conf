# Every piece of Handtop that bypasses apt, so apt never updates it: what it is,
# where updates come from, what it replaces, how a fix reaches handhelds.
# tools/check-upstreams.py reads this file (weekly in GitHub Actions, or by hand)
# and reports each piece whose upstream has moved past the pin.
# Format and how to waive an update: docs/upstreams.md.
#
# Keys:
#   what        what it is and which build step uses it
#   pin         the variables that pin it (build/config.sh, or path:VAR)
#   shadows     the Debian package it replaces, if any
#   check       how the drift check finds the newest upstream (one per line)
#   constraint  what limits updating it
#   delivery    how a fix reaches installed handhelds (now; later)
#   waive       "<upstream version> | <date> | <reason>": that version is known and
#               deliberately not taken; reported as waived instead of behind
#
# Not listed, because apt updates them: Debian packages; Tailscale and Moonlight
# (their vendors' own apt repos). Moonlight bundles its own FFmpeg, which only its
# upstream can fix.

[ffmpeg]
what = FFmpeg release (base of build/04c-v4l2-ffmpeg.sh)
pin = FFMPEG_VERSION FFMPEG_COMMIT
shadows = Debian libavcodec61 libavdevice61 libavfilter10 libavformat61 libavutil59 libpostproc58 libswresample5 libswscale8 (held)
check = debian-security ffmpeg FFMPEG_VERSION
# Debian's ffmpeg version last looked at. When Debian publishes another one
# (7:7.1.5-0+deb13u2, 7:7.1.6-...), compare it with ours and bump this line
# (docs/video-decode.md, "Updating FFmpeg").
debian_seen = 7:7.1.5-0+deb13u1
constraint = Same release as Debian: the libav soname ABI must match the one mpv, Chromium and VLC were built against
delivery = reflash; later the handtop-video package (planned updates without reflashing)
waive =

[kwiboo]
what = Kwiboo's V4L2 request-API patchset, applied onto the FFmpeg release (build/04c-v4l2-ffmpeg.sh)
pin = KWIBOO_BASE KWIBOO_PIN KWIBOO_COMMITS
shadows = none (part of our FFmpeg)
check =
    git-branch https://github.com/Kwiboo/FFmpeg v4l2-request-n7.1.3 KWIBOO_PIN
    git-newer-branches https://github.com/Kwiboo/FFmpeg v4l2-request-n7.1.3 FFMPEG_VERSION
constraint = Must apply onto the FFmpeg release above; a branch for that release would make the diff unnecessary. Branches for a newer FFmpeg major (n8.x) have another libav ABI and don't fit trixie
delivery = with FFmpeg
waive =

[libva-v4l2-request]
what = VA-API driver over the V4L2 request API, for Chromium and VLC (build/04e-va-api.sh)
pin = tools/build-va-v4l2request.sh:VA_TAG
shadows = none
check = git-head https://github.com/sofus13/libva-v4l2_request tools/build-va-v4l2request.sh:VA_TAG
constraint = Needs the kernel's stateless V4L2 uAPI; carries build/patches/libva-v4l2-request-fixes.patch
delivery = reflash; later the handtop-video package
waive = 0e54d318004e | 2026-11-02 | 6 commits, none touch decoding: the project is renamed asahi-va-driver (Apple Silicon focus) and the driver file to asahi_drv_video.so, which would break LIBVA_DRIVER_NAME=v4l2_request. Look again when upstream changes the code

[rocknix]
what = ROCKNIX hardware layer: kernel, U-Boot, device trees, firmware, kernel modules (build/01, 02)
pin = ROCKNIX_VERSION
shadows = none (Handtop runs ROCKNIX's kernel, not Debian's)
check = git-tags https://github.com/ROCKNIX/distribution ^[0-9]{8}$ ROCKNIX_VERSION
constraint = Kernel security fixes come only from here. Every module we build (06b-06e) must be rebuilt against the new kernel, and LINUX_VERSION / KTOOLCHAIN_* follow it
delivery = reflash only (boot layer)
waive = 20261101 | 2026-11-02 | No H700 kernel change: still plain 7.2 with the same patches, no security fixes. Only a rebuild with ROCKNIX's GCC 16.2 (Arm has no 16.x toolchain for our modules yet, see docs/kernel.md) and rocknix-joypad 005033d (moved off input-polldev; our rumble fix still applies). Look again at the next tag

[kernel-modules]
what = Our kernel modules: cedrus video decoder (06b), patched joypad driver (06d), uhid (06e), xinput FunctionFS (06c)
pin = LINUX_VERSION KTOOLCHAIN_VERSION JOYPAD_COMMIT
shadows = ROCKNIX's rocknix-singleadc-joypad module (our build carries the rumble-freeze fix)
check = follows rocknix
constraint = Same kernel source, compiler and vermagic as ROCKNIX_VERSION; JOYPAD_COMMIT is the version that ROCKNIX release ships (its package.mk)
delivery = reflash; later a package per kernel version (reboot required; the joypad module only with a known-good fallback)
waive =

[libreelec-cedrus]
what = Jernej Skrabec's cedrus VP9 series, carried in build/kernel/libreelec/ and applied by build/06b-cedrus.sh
pin = LIBREELEC_CEDRUS_COMMIT (the LibreELEC.tv commit the files were copied from, 2026-11-01; also in build/kernel/libreelec/README.md)
shadows = none (kernel patches, not a package)
check = git-path https://github.com/LibreELEC/LibreELEC.tv master projects/Allwinner/patches/linux/ LIBREELEC_CEDRUS_COMMIT
constraint = Rebased on the ROCKNIX kernel version and applied with patch --fuzz=0, so a kernel bump or a moved series stops the build. LibreELEC master moves almost every day, so the check only counts commits that touch projects/Allwinner/patches/linux/; those include patches for other Allwinner SoCs and drivers, so "behind" means look, not necessarily take. Re-sync on a ROCKNIX bump anyway (issue #8: 0438). Maintaining projects/Allwinner/patches/linux upstream is Jernej's, not ours
delivery = reflash (with the kernel modules)
waive =

[go]
what = Go toolchain for building nwg-drawer (build/00-host-deps.sh, build/04b-nwg-drawer.sh)
pin = GO_VERSION
shadows = none (build host only)
check = go GO_VERSION
constraint = Build time only; newer patch releases of the same minor carry security fixes for what it compiles
delivery = with nwg-drawer
waive =

[nwg-drawer]
what = App launcher (build/04b-nwg-drawer.sh), not packaged in trixie
pin = NWG_DRAWER_VERSION
shadows = none
check = git-tags https://github.com/nwg-piotr/nwg-drawer ^v[0-9]+\.[0-9]+\.[0-9]+$ NWG_DRAWER_VERSION
constraint = Built with our Go; rebuilt with a newer Go also picks up its fixes
delivery = reflash; later the handtop-desktop package
waive =

[chromium-extensions]
what = uBlock Origin Lite, enhanced-h264ify (force-installed by policy, overlay/etc/chromium/policies/managed/extensions.json)
pin = none (extension IDs only)
shadows = none
check = none Chromium updates them from the Chrome Web Store itself
constraint = enhanced-h264ify had its last release in May 2024; if it stops working see docs/video-decode.md, "YouTube in Chromium"
delivery = automatic (Chromium)
waive =
