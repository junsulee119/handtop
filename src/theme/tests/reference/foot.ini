font=Noto Sans Mono:size=9
pad=2x2
[scrollback]
lines=5000
[cursor]
# block cursor in the Handtop accent blue, text under it in the background colour
color=1a1e26 8fb4ff
[colors]
# Handtop palette: one dark terminal for both themes. Background / text as the rest of Handtop;
# the 16 ANSI colours keep their usual meaning, softened to Handtop's accents and all readable on
# the dark background (bright black = dim text and comments).
background=1a1e26
foreground=e8eaee
regular0=2b303b
regular1=ff6b6b
regular2=50c86e
regular3=ffd28f
regular4=8fb4ff
regular5=c79bff
regular6=6fd3d8
regular7=c9ced8
bright0=6b7487
bright1=ff8f8f
bright2=7ee39a
bright3=ffe2a8
bright4=b5cdff
bright5=ddbfff
bright6=9be6ea
bright7=ffffff
selection-foreground=ffffff
selection-background=3d5a8a
