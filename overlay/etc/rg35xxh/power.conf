# RG35XX H power settings (read by the session at login; log out or reboot to apply).
# Sleep after this many minutes without input. 0 = never.
AUTOSLEEP_MINUTES=10
# Also sleep while the charger is connected (yes/no).
AUTOSLEEP_ON_CHARGER=no
# Screen off never auto-sleeps (it keeps SSH and downloads running). Instead, when not charging:
# at this level the screen comes back on with a warning that stays until tapped, plus a vibration...
SCREEN_OFF_WARN_PCT=20
# ...and at this level, still in Screen off, the handheld shuts down cleanly.
SCREEN_OFF_SHUTDOWN_PCT=5
