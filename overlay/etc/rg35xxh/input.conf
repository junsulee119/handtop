# RG35XX H controls (input daemon): the system defaults. Change controls with Apps > Controls
# (saved in ~/.config/rg35xxh/controls/); a line uncommented in the boot partition's
# rg35xxh-input.conf wins over both. Changes apply within a second (docs/services/input-daemon.md).

[settings]
deadzone = 0.12              # stick travel ignored around centre (0..1)
pointer_max_speed = 450      # pointer speed at full tilt, px/s
pointer_curve = 2.0          # 1 = linear; higher = finer control near centre
dpad_speed_ratio = 0.5       # D-pad pointer speed, as a fraction of pointer_max_speed
scroll_speed = 8.4           # right-stick scroll at full tilt, notches/s
scroll_log_k = 9            # scroll curve: higher = faster with a small push; 0 = linear
vol_repeat_delay = 0.4       # hold Vol / F+Vol: start repeating after this, s
vol_repeat_interval = 0.12   # then repeat every this many seconds
power_hold_seconds = 3       # hold Power this long: vibrate + shut down
power_tap_max_seconds = 1    # shorter press: power menu
start_hold_seconds = 1       # gamepad mode: hold Start this long to return to desktop
haptic_strength = 1          # mode-change vibration: 0 = off, 0.5 = half, 1 = full
display_speed_scale = 1      # pointer speed on an HDMI display: 1 = scaled by its size (1080p ~2.75x), 0 = off
natural_scroll = no          # yes: scrolling follows the stick like a touchscreen (directions reversed)
swap_sticks = no             # yes: right stick = pointer, left stick = scroll (desktop mode)
pad_layout = position        # gamepad mode: position (bottom button = Xbox A) or label (A = Xbox A)

[desktop]
# Actions: none, click_left, click_right, click_middle, click_back, click_forward,
#          key:KEY_<NAME>, combo:KEY_<A>+KEY_<B> (2-4 keys, e.g. combo:KEY_LEFTALT+KEY_TAB),
#          launch:<app id> (its .desktop file name, e.g. launch:chromium),
#          copy, paste, osk_toggle, mode_gamepad, power_menu
#          pointer (D-pad directions only: move the pointer), volume_up, volume_down,
#          brightness_up, brightness_down
# Fixed (not configurable): holding Power shuts down; F + Vol = brightness; the D-pad moves
# between keys while the on-screen keyboard is open; sticks: pointer and scroll (swap_sticks).
# The rest of this list is desktop mode only: gamepad mode keeps the usual D-pad, Vol and Power.
a = click_left
b = click_right
x = osk_toggle
y = none
l1 = key:KEY_ESC
r1 = key:KEY_ENTER
l2 = none
r2 = key:KEY_BACKSPACE
l3 = copy
r3 = paste
start = mode_gamepad
select = none
up = pointer
down = pointer
left = pointer
right = pointer
vol_up = volume_up
vol_down = volume_down
f = none                     # a tap of F alone
power = power_menu           # a tap of Power (holding it still shuts down)

[hardware]
# Flip an axis if a stick moves the wrong way.
invert_lx = no
invert_ly = no
invert_rx = no
invert_ry = no
