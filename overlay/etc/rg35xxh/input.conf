# RG35XX H controls (input daemon). Copy this file to the boot partition as
# rg35xxh-input.conf to override it from Windows. Changes apply after re-login/reboot.

[settings]
deadzone = 0.12              # stick travel ignored around centre (0..1)
pointer_max_speed = 450      # pointer speed at full tilt, px/s
pointer_curve = 2.0          # 1 = linear; higher = finer control near centre
dpad_speed = 286             # D-pad pointer speed, px/s
scroll_speed = 8.4           # right-stick scroll at full tilt, notches/s
scroll_log_k = 9            # scroll curve: higher = faster with a small push; 0 = linear
vol_repeat_delay = 0.4       # hold Vol / F+Vol: start repeating after this, s
vol_repeat_interval = 0.12   # then repeat every this many seconds
power_hold_seconds = 3       # hold Power this long: vibrate + shut down
power_tap_max_seconds = 1    # shorter press: power menu
start_hold_seconds = 1       # gamepad mode: hold Start this long to return to desktop
haptic_strength = 1          # mode-change vibration: 0 = off, 0.5 = half, 1 = full

[desktop]
# Actions: none, click_left, click_right, click_middle, key:KEY_<NAME>, copy, paste,
#          osk_toggle, mode_gamepad, power_menu
# Fixed (not configurable): D-pad = pointer / keyboard navigation, left stick = pointer,
# right stick = scroll, F + Vol = brightness, Vol = volume, Power = menu / shutdown.
a = click_left
b = click_right
x = osk_toggle
y = none
l1 = key:KEY_ESC
r1 = key:KEY_ENTER
l2 = none
r2 = key:KEY_BACKSPACE
l3 = copy
r3 = paste
start = mode_gamepad
select = none

[hardware]
# Flip an axis if a stick moves the wrong way.
invert_lx = no
invert_ly = no
invert_rx = no
invert_ry = no
