# Handtop: mpv's buttons on the handheld (docs/apps/videos.md). In desktop mode the input daemon
# turns the buttons into a mouse and keys (/etc/rg35xxh/input.conf): A = left click, B = right
# click, L1 = Esc, R1 = Enter, R2 = Backspace, right stick = scroll wheel, D-pad and left stick
# = pointer. Everything not listed here keeps mpv's default; a user's ~/.config/mpv/input.conf
# is read after this one and wins.

# A on the picture: play / pause (on the on-screen controls A presses that control). A double
# tap does not leave full screen: the handheld has no other way back to it than the controls.
MBTN_LEFT       cycle pause
MBTN_LEFT_DBL   ignore
# B: play / pause too (mpv's default); on the controls' track buttons B opens the track list.
MBTN_RIGHT      cycle pause
# L1: close the video. The position is remembered (save-position-on-quit in mpv.conf).
ESC             quit
# R1 / R2: next / previous file in the playlist (the Videos app passes the whole folder).
ENTER           playlist-next
BS              playlist-prev
# Right stick: seek, up / right forward, down / left back. Faster the further it is pushed, by a
# share of the video's length, at most 10 % of it a second (scripts/handtop-seek.lua; mpv names a
# script after its file with - turned into _).
WHEEL_UP        script-binding handtop_seek/forward
WHEEL_RIGHT     script-binding handtop_seek/forward
WHEEL_DOWN      script-binding handtop_seek/back
WHEEL_LEFT      script-binding handtop_seek/back
