# Hardware decoding through the Cedrus VPU — see docs/video-decode.md.
#
# Both paths to the VPU come from the image's FFmpeg (build/04c-v4l2-ffmpeg.sh
# plus build/patches/ffmpeg-v4l2request-drm.patch): it registers the stateless
# V4L2 request-API decoders under the `v4l2request` hwdevice and, since
# 2026-10-17, under `drm` as well. The `drm` registration is what makes mpv's
# DRM PRIME interop usable, so zero-copy works with an unpatched mpv:
#
#   --hwdec=drm               zero-copy: the decoder's dmabufs go straight to
#                             the VO's DRM PRIME interop
#   --hwdec=drm-copy          each frame is downloaded to memory instead
#   --hwdec=v4l2request       the same decoder under its original device type;
#                             zero-copy only with the patched mpv (route B of
#                             docs/video-decode.md, tools/build-mpv-v4l2request.sh)
#   --hwdec=v4l2request-copy  the copy path under the original device type
#
# auto-safe takes the first of those that actually works, so it lands on
# zero-copy and keeps the copy variants behind it; if a codec is unsupported or
# the VO has no usable interop it falls back on its own. Software decoding is
# the last resort, and it is the one that segfaults intermittently inside Mesa's
# panfrost driver on this device (3/5 normal-playback runs, reproduced with
# Debian's stock libavcodec, so it predates this image), which is why hardware
# decoding is preferred so strongly here.
hwdec=auto-safe

# The default (high-quality) scaler cannot keep up with 1080p on this SoC: 23 fps
# on the gpu VO, i.e. dropped frames at 24 fps, where a bilinear scaler reaches
# 51 fps with 0 dropped frames over 10 s (and 43 fps at 1080p H.264). On a
# 640x480 panel the difference is not visible.
profile=fast

# gpu renders through the GPU and keeps the OSD and subtitles. dmabuf-wayland is
# a little faster still (62 fps at 1080p) but is video only — no OSD and no
# subtitles — so it is not the default.
vo=gpu

# AV1: the Cedrus VPU has no AV1 decoder in this kernel, and auto-safe is not
# enough for it here: mpv tries av1-drm and av1-drm-copy, both fail on every
# frame ("Error while decoding frame (hardware decoding)!"), and only then
# falls back to software. Skip straight to software; it plays these files real
# time with 0 dropped frames (measured 2026-10-17: 1920x884@24 and
# 3840x1772@30). Two constraints: the profile must be active by default
# (mpv 0.40 has no profile-conditional), and it must come last — activating a
# profile re-enables options set above it, which would undo hwdec/profile=fast
# if [default] ran after them.
[av1]
profile=av1
hwdec=no
